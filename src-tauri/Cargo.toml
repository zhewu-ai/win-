[package]
name = "sticky-notes-shell"
version = "0.1.0"
description = "全平台便签 Windows 桌面壳（加载线上 Web 版）"
authors = ["hellomylife"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sticky_notes_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
